version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-city-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Override 127.0.0.1 from .env.local to point to your host machine's databases
      - DATABASE_URL=postgresql://smart_city:password@host.docker.internal:15432/smart_city_db
      - MONGODB_URI=mongodb://host.docker.internal:27017/smart_city
      - REDIS_URL=redis://host.docker.internal:6379
      - ELASTICSEARCH_URL=http://host.docker.internal:9200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
