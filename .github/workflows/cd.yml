name: CD Pipeline

on:
  push:
    branches: [ "develop" ]
    tags: [ "v*.*.*" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        run: docker build -t smart-city-dashboard:${{ github.sha }} .
        
      - name: Push to Registry & Deploy
        run: |
          echo "Placeholder for registry push: docker push myregistry.com/smart-city-dashboard:${{ github.sha }}"
          echo "Placeholder for deploy trigger (e.g., helm upgrade, argocd sync, or ssh script)"
